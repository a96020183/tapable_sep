<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05080d">
<meta name="description" content="TapAble Vision — 端側即時環境辨識與語音導引原型（輔助導引，非自動導盲）。影像僅於裝置端即時處理，不儲存、不上傳。">
<title>TapAble Vision · 環境導引</title>
<style>
:root{color-scheme:dark;--bg:#05080d;--panel:#101823;--line:#3d4c60;--fg:#f2f6fb;--muted:#aab8c9;--accent:#8fe3cf;--warn:#ffb4a2;font-family:system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-size:17px;line-height:1.55;padding-bottom:env(safe-area-inset-bottom)}
header{padding:10px 14px 6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h1{font-size:1.05rem;margin:0;letter-spacing:.02em}
#diag{font-size:.72rem;color:var(--muted)}
#stage{position:relative;margin:0 10px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3}
#view{width:100%;height:100%;display:block;object-fit:cover}
#live{margin:10px 14px 4px;min-height:3.2em;font-size:1.25rem;font-weight:600}
#intent{margin:0 14px;font-size:.78rem;color:var(--accent);font-family:ui-monospace,Consolas,monospace;min-height:1.2em;word-break:break-all}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 14px}
button{font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:52px;flex:1 1 40%}
button.primary{background:#173b31;border-color:var(--accent);color:var(--accent);font-weight:700}
button.active{background:#2a3b52;border-color:#9ec5ff}
button:disabled{opacity:.45}
#settings{margin:4px 14px;color:var(--muted);font-size:.9rem}
#settings label{display:flex;align-items:center;gap:8px;margin:6px 0}
input[type=range]{flex:1}
footer{margin:14px;color:var(--muted);font-size:.78rem;border-top:1px solid var(--line);padding-top:8px}
body.blackout #stage,body.blackout #settings,body.blackout footer,body.blackout header{display:none}
body.blackout{background:#000}
body.blackout #live{font-size:1.6rem;padding-top:30vh;text-align:center}
body.blackout .row button{background:#0a0d10;color:#5a646f;border-color:#20262d}
#exitBlack{display:none}
body.blackout #exitBlack{display:block;position:fixed;bottom:12px;left:12px;right:12px;background:#0a0d10;color:#6b7681;border:1px solid #20262d;border-radius:12px;padding:14px;font-size:1rem}
#arrive{display:none;margin:10px 14px;padding:14px;border:1px solid var(--accent);border-radius:12px;color:var(--accent);font-weight:700;font-size:1.2rem;text-align:center}
#arrive button{margin-top:12px;width:100%;background:#173b31;border:1px solid var(--accent);color:var(--accent);border-radius:12px;padding:14px;font:inherit;font-weight:700;min-height:52px}
body.stage #live{font-size:1.7rem;min-height:2.6em}
body.stage #intent{font-size:.95rem}
/* 模擬機台標記頁 */
body.marker{background:#fff;color:#111;text-align:center}
body.marker .wrap{padding:24px 12px}
body.marker h2{font-size:1.4rem;margin:8px 0}
body.marker #qr img{width:min(70vw,70vh);height:auto;image-rendering:pixelated}
body.marker .pad{margin-top:14px;display:inline-block;border:3px dashed #888;border-radius:16px;padding:18px 26px;font-size:1.1rem;color:#444}
</style>
</head>
<body>
<header><h1>TapAble Vision</h1><span id="diag" aria-hidden="true">初始化…</span></header>
<div id="stage"><canvas id="view" width="640" height="480"></canvas></div>
<p id="live" role="status" aria-live="assertive">按「開始導引」啟動鏡頭與語音。</p>
<p id="intent"></p>
<div id="arrive">✓ 已抵達目標機台</div>
<div class="row">
  <button id="start" class="primary">▶ 開始導引</button>
  <button id="target" disabled>🎯 尋找機台</button>
</div>
<div class="row">
  <button id="ask" disabled>附近有什麼？</button>
  <button id="mic" disabled>🎤 語音指令</button>
</div>
<button id="exitBlack">☀ 退出黑屏模式</button>
<div id="settings">
  <label><input type="checkbox" id="blackout">黑屏模式（防窺，語音照常）</label>
  <label>語速 <input type="range" id="rate" min="0.8" max="1.5" step="0.1" value="1.05"></label>
</div>
<footer>
輔助導引原型，非自動導盲系統——請持續使用白手杖或導盲犬。影像僅於<b>裝置端</b>即時推論後即刻丟棄：不儲存、不上傳、無任何網路傳輸。物件辨識為端側模型（SSDLite-MobileNetV2）；機台外觀比對使用實地照片的特徵向量（照片本體不隨頁面提供），最終確認以視覺標記為準；「螢幕→機台」為 demo 映射。模擬機台標記頁：本網址加 <code>?marker=1</code>；展示模式（字幕放大）加 <code>?stage=1</code>。點一下預覽或字幕可立即中斷目前語音。
</footer>

<script src="./lib/tf.min.js"></script>
<script src="./lib/coco-ssd.min.js"></script>
<script src="./lib/jsQR.js"></script>
<script src="./lib/qrcode.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const P=new URLSearchParams(location.search);

/* ---------- 模擬機台標記頁 ---------- */
if(P.get('marker')){
  document.body.className='marker';
  document.body.innerHTML='<div class="wrap"><h2>模擬機台（示意）</h2><div id="qr"></div><br><div class="pad">📶 感應區（示意）</div><p>把這個畫面全螢幕放在筆電／平板上，<br>它就是 demo 裡的「目標機台」。</p></div>';
  const q=qrcode(0,'M'); q.addData('TAPTHROUGH-KIOSK-01'); q.make();
  document.getElementById('qr').innerHTML=q.createImgTag(10,8);
  document.title='模擬機台標記';
}else{

/* ---------- 主程式 ---------- */
const NOSPEECH=P.get('nospeech')==='1', AUTOSTART=P.get('autostart')==='1';
if(P.get('stage')==='1')document.body.classList.add('stage'); // 展示模式：字幕放大，投影給評審看

/* ---------- 雙重反饋（訪談產出：成功=長震動+清脆音；警告=短震動x2+低沉音）＋防睡眠 ---------- */
let actx=null,wlock=null;
function unlockAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
function tone(f,ms,vol){if(!actx)return;try{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.value=vol||.08;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+ms/1000)}catch(e){}}
function cueWarn(){tone(294,150,.1);setTimeout(function(){tone(294,150,.1)},190);if(navigator.vibrate)navigator.vibrate([90,60,90])}
function cueOk(){tone(1319,160,.09);setTimeout(function(){tone(1760,220,.09)},170);if(navigator.vibrate)navigator.vibrate(250)}
function keepAwake(){if(navigator.wakeLock&&navigator.wakeLock.request)navigator.wakeLock.request('screen').then(function(l){wlock=l}).catch(function(){})}
const view=$('view'),ctx=view.getContext('2d',{willReadFrequently:true});
const live=$('live');
const ZH={person:'行人',bicycle:'自行車',car:'汽車',motorcycle:'機車',airplane:'飛機',truck:'卡車',boat:'船','traffic light':'紅綠燈','fire hydrant':'消防栓','stop sign':'停車標誌','parking meter':'停車收費表',bench:'長椅',bird:'鳥',cat:'貓',dog:'狗',horse:'馬',sheep:'羊',cow:'牛',elephant:'大象',bear:'熊',zebra:'斑馬',giraffe:'長頸鹿',backpack:'背包',umbrella:'雨傘',handbag:'手提包',tie:'領帶',suitcase:'行李箱',frisbee:'飛盤',skis:'滑雪板',snowboard:'滑雪板','sports ball':'球',kite:'風箏','baseball bat':'球棒','baseball glove':'棒球手套',skateboard:'滑板',surfboard:'衝浪板','tennis racket':'球拍',bottle:'瓶子','wine glass':'玻璃杯',cup:'杯子',fork:'叉子',knife:'刀',spoon:'湯匙',bowl:'碗',banana:'香蕉',apple:'蘋果',sandwich:'三明治',orange:'柳橙',broccoli:'花椰菜',carrot:'紅蘿蔔','hot dog':'熱狗',pizza:'披薩',donut:'甜甜圈',cake:'蛋糕',chair:'椅子',couch:'沙發','potted plant':'盆栽',bed:'床','dining table':'桌子',toilet:'馬桶',tv:'螢幕',laptop:'螢幕',mouse:'滑鼠',remote:'遙控器',keyboard:'鍵盤','cell phone':'手機',microwave:'微波爐',oven:'烤箱',toaster:'烤麵包機',sink:'洗手台',refrigerator:'冰箱',book:'書',clock:'時鐘',vase:'花瓶',scissors:'剪刀','teddy bear':'玩偶','hair drier':'吹風機',toothbrush:'牙刷'};
const VEHICLE=new Set(['car','truck','motorcycle','bicycle']); // 公車/列車已整組移除（室內誤報太兇）；飛機/船不在名單
const P0_SCORE=0.66,P0_HITS=2; // 主動警報門檻：高信心＋連續幀，畫框仍用低閾值
const SCREEN=new Set(['tv','laptop']);
/* ---------- 機台外觀比對（round1 實拍照片的特徵向量，照片本體不在此 repo） ---------- */
let kioskNet=null,kioskRefs=null,kioskTh=0.72,kioskHits=0,kioskCand=null,kioskLoading=false;
const kcv=document.createElement('canvas');kcv.width=224;kcv.height=224;
const kcx=kcv.getContext('2d',{willReadFrequently:true});
function initKiosk(){
  if(kioskLoading||kioskNet)return;kioskLoading=true;
  Promise.all([tf.loadLayersModel('./kiosk/model.json'),fetch('./kiosk-refs.json').then(r=>r.json())])
  .then(function(rr){
    const base=rr[0];
    kioskNet=tf.model({inputs:base.inputs,outputs:base.getLayer('conv_pw_13_relu').output});
    kioskRefs=rr[1].refs;kioskTh=rr[1].threshold||0.72;
  }).catch(function(){errors++;kioskLoading=false});
}
function kioskEmbed(){
  return tf.tidy(function(){
    const t=tf.browser.fromPixels(kcv).toFloat().sub(127.5).div(127.5).expandDims(0);
    const f=kioskNet.predict(t).mean([1,2]);
    return Array.from(f.div(f.norm(2,1,true)).dataSync());
  });
}
function kioskProbe(){ // 全幅+左中右三塊，回報最像的區塊與相似度
  if(!kioskNet||!kioskRefs)return null;
  const zones=[[0,0,1,1,-1],[0,0,0.5,1,0],[0.25,0,0.5,1,1],[0.5,0,0.5,1,2]];
  let best={sim:-1,dir:1,zone:null};
  for(const z of zones){
    kcx.drawImage(view,view.width*z[0],view.height*z[1],view.width*z[2],view.height*z[3],0,0,224,224);
    const v=kioskEmbed();
    let s=-1;for(const r of kioskRefs){let d=0;for(let i=0;i<v.length;i++)d+=v[i]*r[i];if(d>s)s=d}
    if(s>best.sim)best={sim:s,dir:z[4]<0?1:z[4],zone:z};
  }
  return best;
}
const TIERS=[[0.30,'很近'],[0.11,'近'],[0.035,'中距離'],[0,'遠']];
const tierOf=a=>TIERS.findIndex(t=>a>=t[0]);
const tierName=i=>TIERS[i][1];
const dirOf=cx=>cx<0.35?0:cx<=0.65?1:2;
const DIR=['左前方','正前方','右前方'], CLOCK=['十點鐘方向','十二點鐘方向','兩點鐘方向'];

let model=null,video=null,running=false,frames=0,errors=0,lastDets=[],lastQR=null;
let targetMode=false,arrived=false,lastGuide={dir:-1,tier:99,t:0},lastHint=0,lastSearchNote=0,tickMs=200;
const tracks=new Map(); // cls -> {seen,area,dir,tier,spoken}
window.__V={get ready(){return !!model},get frames(){return frames},get errors(){return errors},get dets(){return lastDets}};

/* ---------- 語音（P0 打斷，冷卻由事件層管） ---------- */
const synth=window.speechSynthesis;
let zhVoice=null;
function pickVoice(){const vs=synth?synth.getVoices():[];zhVoice=vs.find(v=>/zh[-_](TW|Hant)/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null}
if(synth){pickVoice();synth.onvoiceschanged=pickVoice}
function utter(text){const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';if(zhVoice)u.voice=zhVoice;u.rate=parseFloat($('rate').value);synth.speak(u)}
function speak(text,p0){
  live.textContent=text;
  if(NOSPEECH||!synth)return;
  if(p0){synth.cancel();setTimeout(function(){utter(text)},90)} // iOS：cancel 後要隔一拍再 speak
  else if(!synth.speaking&&!synth.pending)utter(text);
}

/* ---------- 事件引擎：新事件才出聲，沒變化保持靜默 ---------- */
const COOL={vehicle:5000,person:4500,obstacle:6000,screen:9000,guide:3500,search:12000};
// 室內障礙物（花博爭艷館場景）：靜態家具，只在很近且正前方才提醒
const OBSTACLE=new Set(['chair','couch','dining table','bench','potted plant','refrigerator','suitcase','backpack']); // 螢幕(tv/laptop)不算「走路撞到的障礙物」，移出
const GROW=1.18; // 面積成長 18%+ 判定為「朝你逼近」——同向移動/靜止的東西面積不變，不會觸發
function geom(d){const b=d.bbox;return[(b[2]*b[3])/(view.width*view.height),(b[0]+b[2]/2)/view.width]}
// 螢幕(電視/筆電)框內的偵測一律忽略——電視裡的人/車不是真的（組員實測：新聞主播被當行人）。播報與畫框共用
function screenBoxes(dets){return dets.filter(function(d){return SCREEN.has(d.class)&&d.score>=0.5}).map(function(d){return d.bbox});}
function onScreen(d,screens){
  const b=d.bbox,ccx=b[0]+b[2]/2,ccy=b[1]+b[3]/2;
  return screens.some(function(s){return ccx>=s[0]&&ccx<=s[0]+s[2]&&ccy>=s[1]&&ccy<=s[1]+s[3]&&(b[2]*b[3])<(s[2]*s[3])*0.9});
}
// 每個 tick 只講「最該講的那一件」，用逼近偵測濾掉同向/靜止的雜訊（組員回饋：一直平淡播報聽不清）
function evaluate(dets,now){
  // 同類多實例（一堆人／一排椅子）只取「最近的那個」(面積最大) 當代表 ——
  // 否則 track 會被最後一個實例覆寫，方向亂跳、每幀重播，等於把雜訊問題在多人場景重新引入
  const screens=screenBoxes(dets);
  const rep=new Map();
  for(const d of dets){
    const cls=d.class; if(!(cls in ZH))continue;
    if(!SCREEN.has(cls)&&onScreen(d,screens))continue; // 螢幕內容不算真實環境物
    const a=geom(d)[0], cur=rep.get(cls);
    if(!cur||a>cur.a)rep.set(cls,{d:d,a:a});
  }
  let best=null; // {prio,text,cls,a}
  for(const it of rep.values()){
    const d=it.d,cls=d.class;
    const g=geom(d),a=g[0],cx=g[1];
    const dir=dirOf(cx),tier=tierOf(a);
    const t=tracks.get(cls)||{seen:0,area:a,dir:dir,tier:tier,spoken:0,hits:0};
    const fresh=now-t.seen>Math.max(3000,tickMs*2.5); // 窗口隨推論節奏放大，慢裝置不誤判新物件
    t.hits=fresh?1:t.hits+1;
    const solid=d.score>=P0_SCORE&&t.hits>=P0_HITS; // 夠有把握才准開口
    const approaching=!fresh&&a>=t.area*GROW; // 面積在成長＝真的朝你來（同向/靜止不會）
    const enterNear=tier===0&&t.tier!==0; // 這一刻剛進入「很近」
    const cool=now-t.spoken;
    let prio=0,text='';
    if(solid){
      // 車輛：逼近或已很近才報（不再是「看到就報」）
      if(VEHICLE.has(cls)&&tier<=1&&(approaching||tier===0)){
        prio=90+(tier===0?8:0)+(approaching?3:0);
        text='注意，'+DIR[dir]+'有'+ZH[cls]+'，'+tierName(tier)+'。';
      }
      // 行人：剛進入很近報方向，或明顯逼近報靠近
      else if(cls==='person'&&(enterNear||(approaching&&tier<=1))){
        prio=70+(tier===0?8:0);
        text=tier===0?('注意，'+DIR[dir]+'有行人，很近。'):('注意，'+DIR[dir]+'有人靠近。');
      }
      // 室內障礙物：只在正前方＋很近＋（逼近或剛變近）才提醒，避免站著也一直念
      else if(OBSTACLE.has(cls)&&tier===0&&dir===1&&(approaching||enterNear)){
        prio=55;text='注意，前方有障礙物，'+ZH[cls]+'。';
      }
    }
    // 過門檻才算候選：新目標／換方向／逼近升級／或已冷卻夠久
    const cd=VEHICLE.has(cls)?COOL.vehicle:cls==='person'?COOL.person:COOL.obstacle;
    const changed=t.spoken===0||dir!==t.dir||(approaching&&cool>1600)||cool>cd;
    // 同優先時取「最近的」(面積最大)——多個障礙物時念離你最近那個，不是隨機一個
    if(prio>0&&changed&&(!best||prio>best.prio||(prio===best.prio&&a>best.a)))best={prio,text,cls,a};
    t.seen=now;t.area=a;t.dir=dir;t.tier=tier;tracks.set(cls,t);
  }
  if(best){const tt=tracks.get(best.cls);tt.spoken=now;tracks.set(best.cls,tt);cueWarn();speak(best.text,true);}
  if(targetMode&&!arrived)guideTarget(dets,now);
}
window.__V.evaluate=function(dets){evaluate(dets,Date.now())}; // 測試掛鉤：注入合成偵測結果
window.__V.track=function(cls){return tracks.get(cls)||null};
window.__V.kioskInit=initKiosk;window.__V.kioskProbe=function(){return kioskNet?kioskProbe():null};

/* ---------- 目標導引（機台） ---------- */
function guideTarget(dets,now){
  const qr=(lastQR&&now-lastQR.t<1600)?lastQR:null;
  if(qr){
    const dir=dirOf(qr.cx),tier=tierOf(qr.area);
    if(qr.area>=0.16){
      arrived=true;cueOk();
      const ar=$('arrive');ar.style.display='block';
      ar.innerHTML='✓ 已抵達目標機台<br><button id="handoff" type="button">📳 碰觸貼紙 → 交棒操作段（demo 以按鈕模擬）</button>';
      $('handoff').onclick=function(){stop();location.href='../?machine=campus-document-kiosk&demo=1'}; // 交棒前先關相機與 Wake Lock
      speak('已抵達目標機台。請將手機靠近感應區。',true);
      setIntent('{"event":"arrived","target":"kiosk"}');return;
    }
    if(dir!==lastGuide.dir||tier<lastGuide.tier||now-lastGuide.t>COOL.guide){
      speak('機台在'+CLOCK[dir]+'，'+tierName(tier)+'。',false);
      lastGuide={dir:dir,tier:tier,t:now};
    }
    return;
  }
  if(kioskCand&&now-kioskCand.t<2500){ // 照片比對命中（優先於通用螢幕類別）
    if(now-lastHint>COOL.screen){
      speak(CLOCK[kioskCand.dir]+'發現目標機台外觀，請往那個方向靠近，接近後以標記確認。',false);
      lastHint=now;
    }
    return;
  }
  const sc=dets.find(function(d){return SCREEN.has(d.class)});
  if(sc){
    if(now-lastHint>COOL.screen){
      const cx=geom(sc)[1];
      speak(DIR[dirOf(cx)]+'發現螢幕裝置，可能是目標機台，靠近後確認標記。',false);
      lastHint=now;
    }
  }else if(now-lastSearchNote>COOL.search){
    speak('持續尋找機台中，請緩慢左右移動鏡頭。',false);lastSearchNote=now;
  }
}
function setIntent(s){$('intent').textContent=s?('規則判定（非 LLM）：'+s):''}

/* ---------- P2：只在使用者詢問時描述環境 ---------- */
function describe(){
  const parts=lastDets.filter(function(d){return d.class in ZH}).slice(0,4)
    .map(function(d){const g=geom(d);return DIR[dirOf(g[1])]+'有'+ZH[d.class]+'，'+tierName(tierOf(g[0]))});
  speak(parts.length?'目前看到：'+parts.join('；')+'。':'目前沒有辨識到明顯物體。',true);
}

/* ---------- 語音指令（瀏覽器有支援才啟用；iOS 建議用按鈕） ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function listen(){
  if(!SR)return;
  const r=new SR();r.lang='zh-TW';r.interimResults=false;
  speak('請說指令。',true);
  r.onresult=function(e){
    const s=e.results[0][0].transcript;
    if(/找|機台|繳費|列印|印/.test(s)){setTarget(true);setIntent('{"intent":"find_target","target":"kiosk","utterance":"'+s.replace(/"/g,'')+'"}')}
    else if(/附近|什麼|周圍/.test(s))describe();
    else speak('沒聽懂，可以說：幫我找機台。',true);
  };
  r.onerror=function(){speak('語音輸入失敗，請改用按鈕。',true)};
  r.start();
}
function setTarget(on){
  targetMode=on;arrived=false;$('arrive').style.display='none';
  $('target').classList.toggle('active',on);
  $('target').textContent=on?'🎯 尋找中…（點擊停止）':'🎯 尋找機台';
  lastGuide={dir:-1,tier:99,t:0};lastSearchNote=Date.now()-COOL.search+5000;kioskHits=0;kioskCand=null;
  if(on){initKiosk();speak('開始尋找機台。',true);setIntent('{"intent":"find_target","target":"kiosk"}')}
  else{speak('已停止尋找。',true);setIntent('')}
}

/* ---------- 主迴圈：30FPS 取流、約 4–6FPS 推論、同幀掃標記 ---------- */
function loop(){
  if(!running)return;
  const t0=performance.now();
  ctx.drawImage(video,0,0,view.width,view.height);
  let img=null,scanned=false;
  try{img=ctx.getImageData(0,0,view.width,view.height)}catch(e){errors++}
  if(img){
    const code=jsQR(img.data,img.width,img.height,{inversionAttempts:'attemptBoth'});
    if(code&&/TAPTHROUGH/i.test(code.data)){
      const L=code.location;
      const xs=[L.topLeftCorner.x,L.topRightCorner.x,L.bottomLeftCorner.x,L.bottomRightCorner.x];
      const ys=[L.topLeftCorner.y,L.topRightCorner.y,L.bottomLeftCorner.y,L.bottomRightCorner.y];
      const minx=Math.min.apply(null,xs),maxx=Math.max.apply(null,xs);
      const miny=Math.min.apply(null,ys),maxy=Math.max.apply(null,ys);
      const w=maxx-minx,h=maxy-miny;
      // 標記只佔機台一角：面積乘 6 近似機台本體大小
      lastQR={t:Date.now(),area:Math.min(1,(w*h*6)/(view.width*view.height)),cx:(minx+maxx)/2/view.width,box:[minx,miny,w,h]};
      scanned=true;
    }
  }
  model.detect(view,10,0.50).then(function(dets){
    if(scanned&&lastQR)lastQR.t=Date.now(); // 推論耗時不可預期，時效以本 tick 完成時間為準
    tickMs=Math.max(100,performance.now()-t0);
    lastDets=dets;frames++;
    if(targetMode&&!arrived&&kioskNet&&frames%2===0){ // 每兩幀比對一次外觀
      try{
        const kb=kioskProbe();
        if(kb&&kb.sim>=kioskTh){kioskHits++;if(kioskHits>=2)kioskCand={t:Date.now(),dir:kb.dir,sim:kb.sim,zone:kb.zone}}
        else kioskHits=0;
      }catch(e){errors++}
    }
    evaluate(dets,Date.now());
    draw(dets);
    $('diag').textContent=(model?'模型✓ ':'')+frames+'幀'+(errors?' '+errors+'錯誤':'');
    setTimeout(loop,Math.max(40,200-(performance.now()-t0)));
  }).catch(function(){errors++;setTimeout(loop,400)});
}
function draw(dets){
  ctx.lineWidth=4;ctx.font='20px system-ui';
  const screens=screenBoxes(dets);
  for(const d of dets){
    if(!(d.class in ZH))continue;
    if(!SCREEN.has(d.class)&&onScreen(d,screens))continue; // 螢幕內容不畫框（跟播報一致）
    const x=d.bbox[0],y=d.bbox[1],w=d.bbox[2],h=d.bbox[3];
    const p0=VEHICLE.has(d.class)||d.class==='person';
    const isScr=SCREEN.has(d.class);
    ctx.strokeStyle=isScr&&targetMode?'#7fd7ff':(p0?'#ff8f7a':'#8fe3cf');
    ctx.strokeRect(x,y,w,h);
    const label=ZH[d.class]+(isScr?'（映射:機台候選）':'')+' '+Math.round(d.score*100)+'%';
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(x,Math.max(0,y-26),ctx.measureText(label).width+12,26);
    ctx.fillStyle='#fff';ctx.fillText(label,x+6,Math.max(18,y-7));
  }
  if(kioskCand&&Date.now()-kioskCand.t<2500&&kioskCand.zone){
    const z=kioskCand.zone;
    ctx.strokeStyle='#7fd7ff';ctx.setLineDash([10,6]);
    ctx.strokeRect(view.width*z[0]+4,view.height*z[1]+4,view.width*z[2]-8,view.height*z[3]-8);
    ctx.setLineDash([]);
    ctx.fillStyle='#7fd7ff';ctx.fillText('機台（外觀比對 '+Math.round(kioskCand.sim*100)+'%）',view.width*z[0]+10,view.height*z[1]+26);
  }
  if(lastQR&&Date.now()-lastQR.t<1600){
    const b=lastQR.box;ctx.strokeStyle='#ffd166';ctx.strokeRect(b[0],b[1],b[2],b[3]);
    ctx.fillStyle='#ffd166';ctx.fillText('機台標記',b[0],Math.max(14,b[1]-6));
  }
}

/* ---------- 啟動／停止 ---------- */
function start(){
  unlockAudio(); // 必須在使用者手勢裡解鎖，音效反饋才出得來（iOS）
  $('start').disabled=true;$('start').textContent='載入中…';
  live.textContent='正在載入端側模型（首次約 18MB，之後有快取）…';
  const mp=cocoSsd.load({modelUrl:'./model/model.json'});
  navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}})
  .then(function(stream){
    video=document.createElement('video');video.playsInline=true;video.setAttribute('playsinline','');video.muted=true;video.srcObject=stream;
    return video.play();
  })
  .then(function(){return mp})
  .then(function(m){
    model=m;running=true;keepAwake();
    $('target').disabled=$('ask').disabled=false;
    if(SR)$('mic').disabled=false;else $('mic').textContent='🎤（此瀏覽器不支援）';
    $('start').textContent='⏹ 停止';$('start').disabled=false;$('start').onclick=stop;
    speak('環境辨識已開啟。',true);
    loop();
  })
  .catch(function(e){
    errors++;$('start').disabled=false;$('start').textContent='▶ 開始導引';
    live.textContent='啟動失敗：'+((e&&e.name==='NotAllowedError')?'請允許相機權限。':(e&&e.message||e));
  });
}
function recoverCam(){ // 切 app／螢幕鎖回來後，相機軌道常已死，靜靜自救
  if(!running||!video)return;
  const tr=video.srcObject&&video.srcObject.getVideoTracks()[0];
  if(tr&&tr.readyState==='live'){video.play().catch(function(){});return}
  navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}})
  .then(function(s){video.srcObject=s;return video.play()}).catch(function(){errors++});
}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&running){keepAwake();recoverCam()}
});
function stop(){
  running=false;
  if(wlock){wlock.release().catch(function(){});wlock=null}
  if(video&&video.srcObject)video.srcObject.getTracks().forEach(function(t){t.stop()});
  if(synth)synth.cancel();
  $('start').textContent='▶ 開始導引';$('start').onclick=start;
  $('target').disabled=$('ask').disabled=$('mic').disabled=true;
  if(targetMode)setTarget(false);live.textContent='已停止。';
}
$('start').onclick=start;
$('target').onclick=function(){setTarget(!targetMode)};
$('ask').onclick=describe;
$('mic').onclick=listen;
/* 訪談要求「可中斷性」：點預覽或字幕＝立刻略過目前這句 */
function hush(){if(synth&&(synth.speaking||synth.pending)){synth.cancel();live.textContent=live.textContent.replace(/　⏭$/,'')+'　⏭'}}
$('stage').onclick=hush;live.onclick=hush;
function setBlackout(on){
  document.body.classList.toggle('blackout',on);
  $('blackout').checked=on;
  speak(on?'黑屏模式開啟。要退出，請按畫面最下方的按鈕。':'黑屏模式關閉。',true);
}
$('blackout').onchange=function(e){setBlackout(e.target.checked)};
$('exitBlack').onclick=function(){setBlackout(false)};
window.addEventListener('error',function(){errors++});
if(AUTOSTART)start();
if('serviceWorker' in navigator)navigator.serviceWorker.register('../sw.js').catch(function(){}); // 離線快取（模型下載一次後斷網也能開）
}
</script>
